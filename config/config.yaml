# config.yaml
# ============================================================================
# Central configuration for the SAbDab bias/benchmark paper analysis pipeline.
# Every script reads paths and parameters from here - nothing is hardcoded
# inside the analysis scripts themselves. Edit this file to point at your
# real data locations before running anything.
# ============================================================================

paths:
  # Raw SAbDab summary TSV downloaded from the SAbDab website
  # (the same file your preprocess_sabdab.py --summary argument points to)
  sabdab_summary_tsv: "path/to/sabdab_summary_all.tsv"

  # Directory of already-preprocessed SAbDab .pt files
  # (output of your existing preprocess_sabdab.py + assign_antigen_clusters.py)
  sabdab_pt_dir: "path/to/sabdab_processed_files"


  # Thera-SAbDab summary TSV
  thera_sabdab_tsv: "path/to/TheraSAbDab_SeqStruc.csv"

  # OAS preprocessed mmap root (contains train/ and val/ subdirs, or meta.json directly)
  oas_mmap_root: "path/to/oas_mmap_400M_v2/"

  # Where this pipeline writes its own intermediate and final outputs.
  # Kept entirely separate from the training-pipeline directories above -
  # this analysis never writes into sabdab_pt_dir or oas_mmap_root.
  work_dir: "path/to/HIPS_Analysis/"

sampling:
  # OAS is enormous (355M+ samples). We analyze a random subsample for
  # tractability. Set via meta.json's seed for full reproducibility.
  oas_subsample_seed: 42
  oas_subsample_n_heavy: 2000000
  oas_subsample_n_paired: 2000000   # paired only has ~3M total, so this is most of it

mmseqs2:
  min_seq_id: 0.70
  coverage: 0.80
  n_threads: 16
  # Separate clustering run for CDR-H3 sequence redundancy (distinct from
  # the antigen clustering assign_antigen_clusters.py already produced).
  cdrh3_min_seq_id: 0.90   # near-duplicate detection threshold for CDR-H3 itself
  cdrh3_coverage: 0.80

filters:
  # Mirrors the hard filters already baked into your OAS mmap
  # (see meta.json: hard_filters.cdr3_min_len / cdr3_max_len) so the
  # SAbDab side uses an equivalent CDR-H3 length window for fair comparison.
  cdr3_min_len: 3
  cdr3_max_len: 35


scope_notes:
  # These are stated explicitly in the paper's Methods/Limitations section,
  # not silently assumed. Kept here as a single source of truth referenced
  # by figure captions and table footnotes generated by the scripts.
  germline_resolution: "family-level only (e.g. IGHV1), no allele or J-gene - not present in SAbDab summary TSV"
  oas_species_scope: "This OAS mmap was built with an explicit human-only sample filter
    applied at construction time, confirmed against the preprocessing
    pipeline (not merely a loader-default assumption) -- so the
    heavy_species == 'homo sapiens' restriction on the SAbDab side is a
    genuine like-for-like species match, not a one-sided restriction
    against an uncharacterized comparator. For broader context: a
    separate, independently-verified IgLM-derived reprocessing of OAS
    (588,488,146 sequences across the full train+test release) shows the
    unfiltered OAS pool is 82.14% human / 17.86% non-human (mouse, rat,
    rabbit, camelid, rhesus) -- this figure describes OAS generally and
    supersedes this project's earlier 'assumed human-only by convention'
    caveat, but it is not itself evidence about this specific mmap, whose
    human-only composition is independently confirmed by construction."
  oas_germline_scope: "OAS mmap retains no V-gene calls (v_gene_check was filter-only, not stored). RQ2 germline comparison is SAbDab-internal only; OAS comparison is limited to CDR-H3 length and clonotype diversity."
